# yottactl builds, passes go vet and its tests, and is gofmt-clean, from this
# commit, on every push and pull request. Windows builds and vets; its tests
# run on macOS and Linux.

name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Build and vet
        run: |
          go build -o "$RUNNER_TEMP/" ./cmd/yottactl
          go vet ./...

      - name: Test
        if: runner.os != 'Windows'
        run: go test ./...

      - name: yottactl --version
        run: |
          exe=yottactl; [ "$RUNNER_OS" = Windows ] && exe=yottactl.exe
          "$RUNNER_TEMP/$exe" --version
